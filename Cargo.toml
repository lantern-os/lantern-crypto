[package]
name = "lantern-crypto"
version = "0.0.0"
edition = "2021"
description = "LanternOS crypto keystore — Phase 2 prototype (RFC-0007), capability-gated via lantern-capabilities"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "lantern_crypto"
path = "src/lib.rs"

[features]
default = ["kernel-backend"]
# The `&mut KernelState` broker backend — for host tests and for privileged,
# same-address-space callers. A confined Keystore running via the `Abi`
# backend needs none of this and can build with `default-features = false`
# (only `lantern-abi` + the crypto primitives linked) — RFC-0019/ADR-0024.
kernel-backend = ["dep:lantern-hal", "dep:lantern-kernel", "lantern-capabilities/kernel-backend"]

[dependencies]
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main" }
lantern-hal = { git = "https://github.com/lantern-os/lantern-hal", branch = "main", optional = true }
lantern-kernel = { git = "https://github.com/lantern-os/lantern-kernel", branch = "main", optional = true }
lantern-capabilities = { git = "https://github.com/lantern-os/lantern-capabilities", branch = "main", default-features = false }
# Audited primitive implementations, per ADR-0011 and ARCHITECTURE.md's "prefer reviewed
# crates over rolling our own" — no_std, no heap allocation required.
chacha20poly1305 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
blake3 = { version = "1", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }
# Constant-time MAC comparison (X6, THREAT_MODEL.md) — already a transitive
# dependency via chacha20poly1305/ed25519-dalek; depended on directly rather
# than hand-rolling a constant-time compare.
subtle = { version = "2", default-features = false }
